<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Dashboard Interactive</title>
    <!-- Thư viện vẽ biểu đồ Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Link liên kết đến file habits.js -->
    <script src="habits.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #2c3e50;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        h1, h2 { color: #2c3e50; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
            text-align: center;
        }
        th:first-child, td:first-child { text-align: left; font-weight: bold; }
        
        .habit-check {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #2ecc71;
        }

        .chart-container { position: relative; height: 260px; }
        
        .add-form {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .add-form input {
            flex: 1;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-success { background-color: #2ecc71; color: white; margin-top: 15px; width: 100%; }
        .btn-success:hover { background-color: #27ae60; }
        
        .error-msg {
            color: #e74c3c;
            font-weight: bold;
            padding: 15px;
            background: #fdf2f2;
            border-radius: 8px;
            border: 1px solid #f8b4b4;
        }
    </style>
</head>
<body>

    <h1>📊 Habit Dashboard</h1>
    
    <!-- Bảng hiển thị và tương tác -->
    <div class="card">
        <h2>📅 Bảng Theo Dõi Trong Tuần</h2>
        <table>
            <thead>
                <tr>
                    <th>Thói quen</th>
                    <th>T2</th><th>T3</th><th>T4</th><th>T5</th><th>T6</th><th>T7</th><th>CN</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="8">Đang tải dữ liệu...</td></tr>
            </tbody>
        </table>

        <!-- Form thêm thói quen mới -->
        <div class="add-form">
            <input type="text" id="new-habit-input" placeholder="Nhập tên thói quen mới...">
            <button class="btn btn-primary" onclick="addNewHabit()">+ Thêm</button>
        </div>

        <!-- Nút xuất file JS cập nhật -->
        <button class="btn btn-success" onclick="exportUpdatedJS()">💾 Tải File habits.js Đã Cập Nhật</button>
    </div>

    <!-- Biểu đồ -->
    <div class="card">
        <h2>📈 Biểu Đồ Mức Độ Hoàn Thành</h2>
        <div class="chart-container">
            <canvas id="habitChart"></canvas>
        </div>
    </div>

    <script>
        let myChart = null;
        let localData = [];

        document.addEventListener("DOMContentLoaded", function() {
            // 1. Kiểm tra xem có dữ liệu tạm đã lưu trong bộ nhớ trình duyệt chưa
            const savedData = localStorage.getItem('myHabitData');
            
            if (savedData) {
                try {
                    localData = JSON.parse(savedData);
                } catch(e) {
                    localData = [];
                }
            }
            
            if ((!localData || localData.length === 0) && typeof habitData !== 'undefined' && Array.isArray(habitData)) {
                // 2. Nếu chưa có thì đọc từ file habits.js gốc
                localData = JSON.parse(JSON.stringify(habitData));
            }

            if (localData && localData.length > 0) {
                renderTable();
                renderChart();
            } else {
                document.getElementById('table-body').innerHTML = 
                    `<tr><td colspan="8" class="error-msg">❌ Không thấy dữ liệu habits.js! Vui lòng kiểm tra file habits.js đã để chung thư mục chưa.</td></tr>`;
            }
        });

        // Hiển thị bảng tương tác bằng Checkbox
        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            localData.forEach((row, rowIndex) => {
                const tr = document.createElement('tr');
                let html = `<td>${row.Habit || 'Chưa đặt tên'}</td>`;
                const days = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
                
                days.forEach(day => {
                    const isChecked = Number(row[day]) === 1 ? 'checked' : '';
                    html += `<td>
                        <input type="checkbox" class="habit-check" ${isChecked} 
                               onchange="toggleHabit(${rowIndex}, '${day}', this.checked)">
                    </td>`;
                });

                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
        }

        // Xử lý khi người dùng bấm tích / bỏ tích
        function toggleHabit(rowIndex, day, isChecked) {
            localData[rowIndex][day] = isChecked ? 1 : 0;
            
            // Tự động lưu tạm vào trình duyệt (Không bị mất dữ liệu khi F5/Tắt web)
            localStorage.setItem('myHabitData', JSON.stringify(localData));
            
            renderChart();
        }

        // Thêm thói quen mới
        function addNewHabit() {
            const input = document.getElementById('new-habit-input');
            const name = input.value.trim();
            if (!name) {
                alert('Vui lòng nhập tên thói quen!');
                return;
            }

            const newRow = { Habit: name, T2: 0, T3: 0, T4: 0, T5: 0, T6: 0, T7: 0, CN: 0 };
            localData.push(newRow);
            
            localStorage.setItem('myHabitData', JSON.stringify(localData));
            
            input.value = '';
            renderTable();
            renderChart();
        }

        // Vẽ lại Biểu đồ
        function renderChart() {
            const days = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
            let dailyTotals = [0, 0, 0, 0, 0, 0, 0];

            localData.forEach(row => {
                days.forEach((day, index) => {
                    if (Number(row[day]) === 1) {
                        dailyTotals[index]++;
                    }
                });
            });

            const ctx = document.getElementById('habitChart').getContext('2d');
            
            if (myChart) {
                myChart.destroy();
            }

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: days,
                    datasets: [{
                        label: 'Số thói quen hoàn thành',
                        data: dailyTotals,
                        backgroundColor: '#3498db',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1 } }
                    }
                }
            });
        }

        // Xuất file habits.js mới
        function exportUpdatedJS() {
            const fileContent = "const habitData = " + JSON.stringify(localData, null, 4) + ";";
            const blob = new Blob([fileContent], { type: "text/javascript;charset=utf-8" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "habits.js";
            link.click();
        }
    </script>
</body>
</html>
